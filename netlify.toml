# Arkane on Netlify (Next.js App Router).
# Netlify auto-applies the OpenNext adapter for Next.js 13.5+.
# Do not pin @netlify/plugin-nextjs unless you need a fixed adapter version.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
