# Arkane on Netlify (Next.js App Router).
# Explicit Next.js runtime so Netlify does not treat .next as a bare static folder.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
